[project]
name = "divine-world"
version = "0.0.1"
description = "Divine Machinery: o Mundo Vivo — simulação headless de NPCs autônomos"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "paho-mqtt>=2.0,<3",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sim*", "server*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
