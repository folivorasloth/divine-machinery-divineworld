# Roda o Mundo Vivo no homelab (VM Ubuntu + Docker).
#   cp .env.example .env      # ajuste MQTT_HOST, OLLAMA_URL... (o .env não vai para o git)
#   docker compose up -d --build
#   docker compose logs -f world
# Depois: http://<ip-do-homelab>:8000/chat (Chat do Mundo), /viewer/?screen=<id> (as telas 3D),
# /viewer/layout.html (mapa das telas) e /api/state.
#
# Um serviço só ("world") com a simulação E o servidor no mesmo processo
# (python -m server): a simulação é a dona do estado e a única que escreve no
# SQLite; a API lê o snapshot e manda comandos pela fila (docs/arquitetura.md 1.1).
# Sem broker MQTT e sem Ollama o mundo funciona igual (só avisa no log).
services:
  world:
    build: .
    image: divine-world:dev
    container_name: dw-world
    env_file:
      - path: .env
        required: false
    environment:
      DW_DB_PATH: /app/var/world.sqlite
      DW_WEATHER_CACHE: /app/var/clima.json
      # dentro do container o servidor sempre escuta na 8000; a porta do host
      # é a de DW_SERVER_PORT (em "ports", abaixo)
      DW_SERVER_HOST: 0.0.0.0
      DW_SERVER_PORT: "8000"
    ports:
      - "${DW_SERVER_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data      # os YAML: edite e reinicie (docker compose restart world)
      - ./var:/app/var        # o SQLite, o cache do clima
      # Fase 5: os .glb do João (soltar um arquivo aqui troca o placeholder, sem rebuild)
      - ./viewer/public/models:/app/viewer/public/models
    command: ["python", "-m", "server", "--porta", "8000"]
    restart: unless-stopped
    stop_grace_period: 20s    # dá tempo de salvar o mundo no SIGTERM
