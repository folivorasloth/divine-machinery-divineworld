# Roda o Mundo Vivo no homelab (VM Ubuntu + Docker).
#   docker compose up --build
# Endereços e senhas vêm do arquivo .env (copie de .env.example; o .env
# não vai para o git).
#
# Fase 1: o serviço "sim" roda a simulação headless em tempo real, com o
# Chat do Mundo no log do container (docker compose logs -f sim). O estado
# fica em ./var/world.sqlite e sobrevive a reinícios.
# Fase 4 troca o "command" por `python -m server` (simulação + API/WebSocket
# + ponte MQTT no mesmo processo, com a porta publicada).
services:
  sim:
    build: .
    image: divine-world:dev
    container_name: dw-world
    env_file:
      - path: .env
        required: false
    environment:
      DW_DB_PATH: /app/var/world.sqlite
    volumes:
      - ./data:/app/data
      - ./var:/app/var
    command: ["python", "-m", "tools.run"]
    restart: unless-stopped
