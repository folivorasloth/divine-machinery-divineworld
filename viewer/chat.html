<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat do Mundo</title>
<!--
  Chat do Mundo (Fase 4). Servido pelo próprio servidor em /chat.
  Feito para ficar aberto numa tela dedicada: fluxo ao vivo (WebSocket /ws/chat),
  filtros por personagem, lugar, tipo e período (histórico em /api/chat) e a
  linha do tempo dos grandes acontecimentos (/api/timeline).
  Parâmetros na URL (para deixar uma tela já filtrada): ?personagem=clown&lugar=tavern&tipo=briga&fonte=22&tema=escuro
-->
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e8e6e3; --dim: #8a8f9c;
    --accent: #ffb347; --briga: #ff6b6b; --morte: #9aa9ff; --seita: #d58cff; --igreja: #ffe08a;
    --nascimento: #7dffa6; --misterio: #8fe3ff; --criador: #7dffa6; --evento: #ffb347; --clima: #8ab4ff;
    --font: 20px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f6f4ef; --panel: #ffffff; --line: #e2ded5; --text: #22201c; --dim: #6b6862;
      --accent: #b35c00; --briga: #c0392b; --morte: #3f51b5; --seita: #8e24aa; --igreja: #9a7b00;
      --nascimento: #1b8a3c; --misterio: #00799e; --criador: #1b8a3c; --evento: #b35c00; --clima: #2f5fb3; }
  }
  :root[data-theme="light"] { --bg: #f6f4ef; --panel: #ffffff; --line: #e2ded5; --text: #22201c; --dim: #6b6862;
    --accent: #b35c00; --briga: #c0392b; --morte: #3f51b5; --seita: #8e24aa; --igreja: #9a7b00;
    --nascimento: #1b8a3c; --misterio: #00799e; --criador: #1b8a3c; --evento: #b35c00; --clima: #2f5fb3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: var(--font)/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); font-size: 15px; }
  header h1 { font-size: 20px; margin: 0 8px 0 0; letter-spacing: .02em; }
  header .world { color: var(--dim); margin-right: auto; }
  header .world b { color: var(--text); font-weight: 600; }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
  select, input, button { font: inherit; font-size: 15px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr minmax(260px, 30%); min-height: 0; }
  #feed { overflow-y: auto; padding: 8px 16px 40px; min-height: 0; }
  #timeline { overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 8px 14px;
    font-size: 15px; min-height: 0; }
  #timeline h2 { font-size: 16px; margin: 6px 0 10px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .ev { display: grid; grid-template-columns: 5.2em 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line);
    animation: in .4s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .ev .t { color: var(--dim); font-variant-numeric: tabular-nums; font-size: .8em; padding-top: .2em; }
  .ev .t small { display: block; font-size: .8em; }
  .ev .place { color: var(--dim); font-size: .8em; margin-right: .4em; }
  .ev.imp0 .txt { opacity: .78; }
  .ev.imp2 .txt { font-weight: 600; }
  .ev.imp3 { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .ev.imp3 .txt { font-weight: 700; font-size: 1.1em; }
  .tag-briga .txt { color: var(--briga); } .tag-morte .txt { color: var(--morte); }
  .tag-seita .txt { color: var(--seita); } .tag-igreja .txt { color: var(--igreja); }
  .tag-nascimento .txt { color: var(--nascimento); } .tag-misterio .txt { color: var(--misterio); }
  .tag-criador .txt { color: var(--criador); } .tag-clima .txt { color: var(--clima); }
  .tl { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .tl .t { color: var(--dim); font-size: .85em; }
  .tl.imp3 { font-weight: 700; }
  #status { font-size: 13px; color: var(--dim); }
  #status.live { color: var(--nascimento); }
  #more { margin: 10px 0; }
  #paused { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: none;
    background: var(--accent); color: #000; border: 0; padding: 6px 14px; border-radius: 20px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } #timeline { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Chat do Mundo</h1>
  <span class="world" id="world">conectando…</span>
  <label>Personagem <select id="f-character"><option value="">todos</option></select></label>
  <label>Lugar <select id="f-place"><option value="">todos</option></select></label>
  <label>Tipo <select id="f-tag"><option value="">tudo</option></select></label>
  <label>De <input id="f-since" type="datetime-local"></label>
  <label>Até <input id="f-until" type="datetime-local"></label>
  <label>Só importantes <input id="f-imp" type="checkbox"></label>
  <button id="b-clear" title="limpar filtros">limpar</button>
  <button id="b-font" title="tamanho da letra">A±</button>
  <span id="status">offline</span>
</header>
<main>
  <section id="feed" aria-live="polite">
    <button id="more">carregar mais antigos</button>
    <div id="list"></div>
  </section>
  <aside id="timeline"><h2>Linha do tempo</h2><div id="tl"></div></aside>
</main>
<button id="paused">↓ novas mensagens</button>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const list = $("list"), feed = $("feed");
const params = new URLSearchParams(location.search);
const MAX_ITEMS = 1500;
let meta = { characters: [], places: [], categories: [] };
let names = {};
let oldest = null;          // id do evento mais antigo mostrado (para "carregar mais")
let stick = true;           // grudado no fim (rolagem automática)
const seen = new Set();

function filters() {
  const f = {
    character: $("f-character").value, place: $("f-place").value, tag: $("f-tag").value,
    since: $("f-since").value, until: $("f-until").value, imp: $("f-imp").checked,
  };
  return f;
}
function worldTs(local) { return local ? local + ":00" : ""; }   // datetime-local -> "2026-11-10T07:00:00"
function matches(ev, f) {
  if (ev.type === "move_started" || ev.type === "move_arrived" || ev.type === "tension" || ev.type === "decision") return false;
  if (f.character && !(ev.actors || []).includes(f.character)) return false;
  if (f.place && ev.place !== f.place) return false;
  if (f.tag && !(ev.tags || []).includes(f.tag)) return false;
  if (f.imp && (ev.importance || 0) < 1) return false;
  const ts = (ev.ts || "").slice(0, 19);
  if (f.since && ts < worldTs(f.since)) return false;
  if (f.until && ts > worldTs(f.until)) return false;
  if (ev.data && ev.data.spoke) return false;      // a fala (speech) já conta o que aconteceu
  if (ev.type === "action_finished" && !ev.text_rendered) return false;
  if (!ev.text_rendered) return false;
  return true;
}
function fmt(ts) {
  const d = ts.slice(8, 10) + "/" + ts.slice(5, 7), h = ts.slice(11, 16);
  return `${h}<small>${d}</small>`;
}
function node(ev) {
  const div = document.createElement("div");
  const tags = (ev.tags || []).map((t) => "tag-" + t).join(" ");
  div.className = `ev imp${ev.importance || 0} ${tags} type-${ev.type}`;
  div.dataset.id = ev.id;
  const t = document.createElement("div"); t.className = "t"; t.innerHTML = fmt(ev.ts);
  const x = document.createElement("div"); x.className = "txt";
  if (ev.place) { const p = document.createElement("span"); p.className = "place"; p.textContent = names[ev.place] || ev.place; x.appendChild(p); }
  x.appendChild(document.createTextNode(ev.text_rendered));
  div.append(t, x);
  return div;
}
function append(ev) {
  if (seen.has(ev.id)) return;
  seen.add(ev.id);
  list.appendChild(node(ev));
  while (list.children.length > MAX_ITEMS) { const first = list.firstElementChild; seen.delete(+first.dataset.id); first.remove(); oldest = +list.firstElementChild.dataset.id; }
  if (stick) feed.scrollTop = feed.scrollHeight; else $("paused").style.display = "block";
}
function tlNode(ev) {
  const div = document.createElement("div");
  div.className = `tl imp${ev.importance}`;
  div.innerHTML = `<div class="t">${ev.ts.slice(8, 10)}/${ev.ts.slice(5, 7)} ${ev.ts.slice(11, 16)}</div>`;
  div.appendChild(document.createTextNode(ev.text_rendered));
  return div;
}
function query(extra) {
  const f = filters(), q = new URLSearchParams({ limit: "200" });
  if (f.character) q.set("character", f.character);
  if (f.place) q.set("place", f.place);
  if (f.tag) q.set("tag", f.tag);
  if (f.since) q.set("since", worldTs(f.since));
  if (f.until) q.set("until", worldTs(f.until) + "~");
  if (f.imp) q.set("min_importance", "1");
  for (const [k, v] of Object.entries(extra || {})) q.set(k, v);
  return q;
}
async function loadHistory(older) {
  const q = query(older && oldest ? { before_id: String(oldest) } : {});
  const r = await fetch("/api/chat?" + q);
  const { events } = await r.json();
  const f = filters();
  const items = events.filter((e) => matches(e, f)).reverse();     // a API manda os mais novos primeiro
  if (older) {
    const h = feed.scrollHeight;
    for (const ev of items.reverse()) { if (!seen.has(ev.id)) { seen.add(ev.id); list.insertBefore(node(ev), list.firstChild); } }
    feed.scrollTop = feed.scrollHeight - h;
  } else {
    list.innerHTML = ""; seen.clear();
    for (const ev of items) { seen.add(ev.id); list.appendChild(node(ev)); }
    feed.scrollTop = feed.scrollHeight; stick = true;
  }
  if (events.length) oldest = Math.min(...events.map((e) => e.id), oldest || Infinity);
}
async function loadTimeline() {
  const r = await fetch("/api/timeline?min_importance=2&limit=80");
  const { events } = await r.json();
  const tl = $("tl"); tl.innerHTML = "";
  for (const ev of events) if (ev.text_rendered) tl.appendChild(tlNode(ev));
}
async function loadState() {
  try {
    const s = await (await fetch("/api/state")).json();
    const w = s.weather || {};
    $("world").innerHTML = `<b>${s.ts.slice(11, 16)}</b> ${s.ts.slice(8, 10)}/${s.ts.slice(5, 7)} · ${w.label || ""}` +
      ` · ${s.population} vivos · tensão ${Math.round(s.tension)}` + (s.paused ? " · <b>pausado</b>" : "") +
      (s.speed !== 1 ? ` · ${s.speed}×` : "");
  } catch (e) { /* servidor reiniciando */ }
}
function fill(sel, items, param) {
  for (const it of items) { const o = document.createElement("option"); o.value = it.id; o.textContent = it.name; sel.appendChild(o); }
  if (params.get(param)) sel.value = params.get(param);
}
let ws = null, backoff = 1000;
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
  ws.onopen = () => { $("status").textContent = "ao vivo"; $("status").className = "live"; backoff = 1000; };
  ws.onclose = () => { $("status").textContent = "reconectando…"; $("status").className = ""; setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 15000); };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type !== "event") return;
    const ev = msg.event;
    for (const a of ev.actors || []) if (!names[a]) names[a] = a;
    if (matches(ev, filters())) append(ev);
    if ((ev.importance || 0) >= 2 && ev.text_rendered && !["speech", "action_finished", "tension"].includes(ev.type)) {
      const tl = $("tl"); tl.insertBefore(tlNode(ev), tl.firstChild);
    }
  };
}
async function init() {
  meta = await (await fetch("/api/meta")).json();
  document.title = "Chat do Mundo — " + meta.name;
  for (const c of meta.characters) names[c.id] = c.name;
  for (const p of meta.places) names[p.id] = p.name;
  fill($("f-character"), meta.characters, "personagem");
  fill($("f-place"), meta.places, "lugar");
  fill($("f-tag"), meta.categories, "tipo");
  if (params.get("tema")) document.documentElement.dataset.theme = params.get("tema") === "claro" ? "light" : "dark";
  if (params.get("fonte")) document.documentElement.style.setProperty("--font", params.get("fonte") + "px");
  for (const id of ["f-character", "f-place", "f-tag", "f-since", "f-until", "f-imp"]) $(id).addEventListener("change", () => loadHistory(false));
  $("b-clear").onclick = () => { for (const id of ["f-character", "f-place", "f-tag", "f-since", "f-until"]) $(id).value = ""; $("f-imp").checked = false; loadHistory(false); };
  $("b-font").onclick = () => { const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--font")); document.documentElement.style.setProperty("--font", (cur >= 30 ? 16 : cur + 4) + "px"); };
  $("more").onclick = () => loadHistory(true);
  $("paused").onclick = () => { stick = true; feed.scrollTop = feed.scrollHeight; $("paused").style.display = "none"; };
  feed.addEventListener("scroll", () => {
    stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
    if (stick) $("paused").style.display = "none";
  });
  await loadHistory(false);
  await loadTimeline();
  loadState(); setInterval(loadState, 5000);
  connect();
}
init();
</script>
</body>
</html>
