# Leis e punição: o Fiscal, advertências, prisão, Limbo, denúncias, fugas.
# Formato explicado no topo de rotina.yaml.
# {infracao} é o nome da infração (pichação, roubo, briga...);
# na denúncia, {terceiro} é quem denunciou.
situacoes:
  infracao_flagrante:
    - "{eu} apita: \"*PRIIIIII* Infração de {infracao}, em flagrante!\" e aponta pra {outro}."
    - "{eu} saca o bloquinho na frente de {outro}: \"Infração: {infracao}. Anotado.\""
    - "{eu} pega {outro} no ato: \"Isso é {infracao}! Eu vi! Eu VI!\""
    - "{eu} apita tão alto que {outro} derruba o que estava segurando. \"Flagrante de {infracao}!\""
    - "{eu} mede {outro} com a régua e anota: {infracao}, artigo que ele acabou de inventar."
    - "{eu} surge do nada atrás de {outro}: \"Isso é {infracao}, cidadão.\""
    - "{eu} aponta o apito para {outro} como se fosse uma arma: \"Mãos ao alto! Isso é {infracao}!\""
    - "{eu} anota {infracao} de {outro} com a letra mais caprichada do mundo."
    - "{eu} apita três vezes: \"Tem {infracao} em via pública! {outro}, não se mexa!\""
    - "{eu} tira uma foto mental de {outro} cometendo {infracao}. Vai pro arquivo."
    - "{eu} sopra o apito até ficar roxo: \"É {infracao}, é {infracao}!\""
    - "{eu} pigarreia ao lado de {outro}: \"Hum hum. Isso aí é {infracao}.\""
    - "{eu} mostra o bloquinho pra {outro}: a página já tem o nome del{outro:e|a} escrito."
    - "{eu} dança de felicidade por dentro: finalmente um flagrante de {infracao}. Por fora, apita."
    - "{eu} grita \"{bordao}\" e registra {infracao} de {outro}."

  infracao_assinatura:
    - "{eu} encontra uma pichação assinada por {outro}. \"Assinou. Ele assinou.\" Anota {infracao}."
    - "{eu} lê o nome de {outro} na pichação, letra por letra, e apita. Infração: {infracao}."
    - "{eu} tira a régua e mede a assinatura de {outro} no muro. {infracao}, comprovada."
    - "{eu} fotografa com os olhos a pichação assinada por {outro}. Vai pro bloquinho."
    - "{eu} acha a assinatura de {outro} no muro e quase chora de alegria burocrática."
    - "{eu} anota: \"{infracao}, autor: {outro} (ele mesmo assinou)\"."
    - "{eu} apita para o muro. Depois para o nome de {outro} no muro."
    - "{eu} cheira a tinta fresca da pichação de {outro}. \"Infração recente.\""

  infracao_denuncia:
    - "{eu} anota a denúncia de {terceiro}: {infracao} de {outro}."
    - "{eu} ouve a história e escreve no bloquinho: {outro}, {infracao}. Testemunha: {terceiro}."
    - "{eu} agradece a denúncia de {terceiro} e afia o lápis. {outro} está encrencad{outro:o|a}."
    - "{eu} carimba a denúncia contra {outro}: {infracao}."
    - "{eu} abre uma ficha nova: \"{outro} — {infracao} — segundo {terceiro}\"."
    - "{eu} anota {infracao} de {outro}. Não confere nada. Burocracia é fé."
    - "{eu} esfrega as mãos: {infracao} de {outro}, denunciada por {terceiro}."
    - "{eu} apita sozinho no escritório: tem {infracao} nova contra {outro}."
    - "{eu} lê a denúncia de {terceiro} duas vezes e escreve: CULPAD{outro:O|A}."
    - "{eu} ouve a fofoca e transforma em processo: {outro}, {infracao}."

  advertencia:
    - "{eu} dá uma advertência para {outro}. \"Da próxima vez é cadeia.\""
    - "{eu} entrega a {outro} uma advertência por escrito, em três vias."
    - "{eu} adverte {outro} e manda assinar. {outro} assina com um desenho."
    - "{eu} aponta o dedo pra {outro}: \"Fica o aviso.\""
    - "{eu} lê pra {outro} o regulamento inteiro. Demora."
    - "{eu} dá uma advertência pra {outro} e um sermão de brinde."
    - "{eu} carimba a testa de {outro}. Não pode, mas fez."
    - "{eu} adverte {outro}: \"Estou de olho.\" E fica mesmo."
    - "{eu} escreve uma advertência pra {outro}, mas no verso escreve outra regra nova."
    - "{eu} explica pra {outro} que é a primeira advertência. Mostra a lista: é a primeira de muitas."
    - "{eu} adverte {outro} com o apito na boca, o que deixa tudo incompreensível."
    - "{eu} dá uma advertência pra {outro} e sai medindo a calçada."
    - "{eu} adverte {outro} e cola o papel na roupa del{outro:e|a}."
    - "{eu} diz pra {outro}: \"Advertência. Mais uma e você vê o sol nascer quadrado.\""
    - "{eu} anota a advertência de {outro} e sublinha duas vezes."

  prisao:
    - "{eu} apita e leva {outro} para {@prison}."
    - "{eu} algema {outro} com um barbante oficial e leva pra {@prison}."
    - "{eu} anuncia: \"{outro}, você está preso por {infracao}!\" e aponta o caminho da cela."
    - "{eu} arrasta {outro} pela orelha até {@prison}."
    - "{eu} acompanha {outro} até a cela, apitando o caminho inteiro."
    - "{eu} prende {outro} por {infracao}. A cidade inteira olha pela janela."
    - "{eu} conduz {outro} pra cadeia com toda a pompa de uma procissão."
    - "{eu} tranca {outro} na cela e lê em voz alta o regulamento pela grade."
    - "{eu} leva {outro} preso por {infracao}. {outro} jura inocência."
    - "{eu} prende {outro} e escreve no bloquinho: \"Hoje foi um bom dia.\""
    - "{eu} fecha a grade atrás de {outro}: \"Doze horas pra pensar no que fez.\""
    - "{eu} carrega {outro} até a cela. {outro} esperneia."
    - "{eu} prende {outro} e ainda mede a cela com a régua, pra ficar no padrão."
    - "{eu} leva {outro} preso. No caminho, um passarinho faz cocô em {eu}. Justiça poética."
    - "{eu} prende {outro} por {infracao} e fica feliz como nunca."

  limbo:
    - "{eu} pede o Limbo para {outro}. Um clarão branco, um silêncio, e {outro} some."
    - "{eu} abre o livro dos casos graves: {outro} vai pro Limbo. A tela pisca."
    - "{eu} sussurra: \"Limbo.\" {outro} desaparece num silêncio branco."
    - "{eu} carimba a ficha de {outro} com LIMBO. O carimbo brilha. {outro} não está mais aqui."
    - "{eu} declara {outro} caso grave. O mundo fica branco por um segundo e {outro} se vai."
    - "{eu} aponta pra {outro}: \"Limbo.\" Ninguém nunca viu {eu} tão sério."
    - "{outro} olha pra tela, assustad{outro:o|a}, e some. {eu} apita baixinho."
    - "{eu} manda {outro} pro Limbo por {infracao}. A cidade inteira fica quieta."

  solto:
    - "{eu} sai da prisão, de cabeça baixa."
    - "{eu} sai da cela e respira o ar da liberdade. Tosse."
    - "{eu} sai da prisão jurando que era inocente."
    - "{eu} é solt{o|a} e já sai procurando quem dedurou."
    - "{eu} deixa a prisão e promete nunca mais. Promessa fraca."
    - "{eu} sai da cadeia {humor}."
    - "{eu} sai da prisão com doze riscos na parede e muitas histórias."
    - "{eu} ganha a liberdade e a primeira coisa que faz é comer."
    - "{eu} sai da cela e faz um gesto feio na direção da Prefeitura."
    - "{eu} sai da prisão mais sábi{o|a}. Ou não."

  volta_do_limbo:
    - "{eu} volta do Limbo. Está diferente: agora parece {traco}."
    - "{eu} reaparece na Praça, piscando, branco como papel. Voltou {traco}."
    - "Um clarão, e {eu} está de volta do Limbo. Alguma coisa mudou: está {traco}."
    - "{eu} volta do Limbo sem dizer onde esteve. Só que agora é {traco}."
    - "{eu} sai do Limbo e olha pra tela por tempo demais. Voltou {traco}."
    - "{eu} volta, mas não é mais o mesmo. Dizem que voltou {traco}."
    - "{eu} reaparece. Ninguém consegue explicar, mas {eu} ficou {traco}."
    - "{eu} volta do silêncio branco do Limbo, {traco}, com um olhar estranho."

  fuga:
    - "{outro} vê {eu} chegando e sai correndo!"
    - "{outro} escapa por entre as pernas de {eu}."
    - "{outro} joga areia nos olhos de {eu} e foge."
    - "{eu} apita, {outro} corre. A cidade inteira assiste."
    - "{outro} finge um desmaio e, quando {eu} se abaixa, sai correndo."
    - "{outro} grita \"OLHA ALI!\" e, quando {eu} olha, foge."
    - "{eu} tropeça no próprio apito e {outro} escapa."
    - "{outro} sobe num telhado e some. {eu} anota: fuga, infração extra."
    - "{eu} tenta prender {outro}, mas {outro} é mais rápid{outro:o|a}."
    - "{outro} foge levando o bloquinho de {eu}. Que audácia."

  prender:
    - "{eu} encontra {outro}: \"Teje preso!\""
    - "{eu} chega por trás de {outro} e põe a mão no ombro del{outro:e|a}: \"Mandado de prisão.\""
    - "{eu} acha {outro} e lê o mandado em voz alta, com pausas dramáticas."
    - "{eu} cerca {outro}: \"Acabou a brincadeira. Você responde por {infracao}.\""
    - "{eu} aparece na frente de {outro}, de apito em punho."
    - "{eu} sorri pra {outro} pela primeira vez. É assustador."
    - "{eu} encontra {outro} e mostra o papel com o nome del{outro:e|a} e um desenho de grades."
    - "{eu} anuncia pra {outro}: \"Você tem o direito de ficar calad{outro:o|a}. Eu, não.\""
    - "{eu} chega bufando: \"{outro}, em nome do regulamento!\""
    - "{eu} tira o apito do bolso e encara {outro}. Duelo ao meio-dia."

  patrulha:
    - "{eu} faz a ronda medindo as calçadas."
    - "{eu} patrulha {lugar} anotando tudo que acha suspeito. Tudo é suspeito."
    - "{eu} passa por {lugar} de mãos para trás, olhando torto pra todo mundo."
    - "{eu} mede a altura da grama de {lugar}. Está fora do padrão."
    - "{eu} apita para uma galinha. Por precaução."
    - "{eu} inventa, ali mesmo, uma regra nova para {lugar}."
    - "{eu} anda em linha reta por {lugar}, desviando de ninguém."
    - "{eu} confere se as placas estão no lugar. Não estão. Nunca estão."
    - "{eu} conta os bancos da praça. Faltam zero. Fica decepcionado."
    - "{eu} faz a ronda e cumprimenta só quem está de acordo com a norma: ninguém."

  denuncia:
    - "{eu} conta para {outro} que {fato}."
    - "{eu} vai até {outro}: \"Eu vi tudo. {fato}.\""
    - "{eu} cochicha pra {outro} que {fato}. {outro} já está sacando o bloquinho."
    - "{eu} entrega {terceiro}: {fato}."
    - "{eu} chega na mesa de {outro} e despeja: {fato}."
    - "{eu} denuncia {terceiro} pra {outro}: {fato}. \"Faça alguma coisa!\""
    - "{eu} diz que não é dedo-duro, mas {fato}."
    - "{eu} conta pra {outro}, com ar de vingança, que {fato}."
    - "{eu} chega com uma lista: primeiro item, {fato}."
    - "{eu} jura pra {outro} que {fato}. Pode ser verdade. Pode não ser."
    - "{eu} denuncia {terceiro}. {fato}, segundo {eu}."
    - texto: "{eu} conta pra {outro} que {fato}. \"{bordao}\""
      peso: 2

  resposta_fiscal:
    - "{eu} anota tudo, feliz da vida."
    - "{eu} agradece a colaboração com um aperto de mão burocrático."
    - "{eu} carimba a denúncia. *TUM*"
    - "{eu} diz: \"Vou investigar.\" Vai prender."
    - "{eu} apita de alegria. *PRIII*"
    - "{eu} abre uma pasta nova só para isso."
    - "{eu} pergunta se tem provas. Não espera a resposta."
    - "{eu} sorri de um jeito que ninguém gosta."
    - "{eu} anota e sublinha. Duas vezes."
    - "{eu} diz que a justiça será feita. Até as 18h, que depois ele vai embora."
    - "{eu} mede a denúncia com a régua. Está dentro do padrão."
    - "{eu} escreve tudo em três vias e guarda as três no mesmo bolso."
    - "{eu} agradece e pergunta se a pessoa também quer denunciar mais alguém, já que está aqui."
    - "{eu} lambe a ponta do lápis e anota com letra de professora."
    - "{eu} diz \"Infração!\" baixinho, só para treinar."
    - "{eu} carimba o papel duas vezes, por garantia."
    - "{eu} promete providências. Promete com o apito na boca."
    - "{eu} guarda o bloquinho no peito, perto do coração."
    - "{eu} faz um sinal de positivo e já sai olhando em volta, procurando o culpado."
    - "{eu} pergunta a data, a hora e a cor da roupa de todo mundo envolvido."
    # Fase 4: mais respostas (o relatório de variedade pegou "promete providências" 5× numa semana)
    - "{eu} abre o bloquinho numa página em branco com uma cerimônia de missa."
    - "{eu} pede para repetir mais devagar, porque está anotando em letra de forma."
    - "{eu} fica tão emocionad{o|a} com a denúncia que precisa sentar."
    - "{eu} carimba a denúncia, carimba a própria mão e carimba o ar, por via das dúvidas."
    - "{eu}: \"Isso vai para o arquivo. O arquivo é uma gaveta. Mas é um arquivo.\""
    - "{eu} agradece com um apito curto e outro longo. Ninguém sabe o código."
    - "{eu} mede a distância entre {outro} e a porta. Anota também."
    - "{eu} pergunta se pode citar a denúncia no relatório mensal. Não existe relatório mensal."
    - "{eu} ajeita o bigodinho, satisfeit{o|a}: \"Excelente. Excelente!\""
    - "{eu} guarda a denúncia numa pasta escrita URGENTE, junto com as outras quarenta."
