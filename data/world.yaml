# =====================================================================
# world.yaml — configuração geral do Mundo Vivo
# =====================================================================
# Tudo aqui pode ser editado à mão. Depois de editar, rode:
#     python -m tools.validate
#
# Endereços e senhas NÃO ficam escritos aqui (o repositório é público):
# use ${VARIAVEL:-padrão}. O valor vem da variável de ambiente (ou do
# arquivo .env no docker compose); se ela não existir, vale o padrão.
# Veja .env.example.
# =====================================================================

nome: Divine Machinery — o Mundo Vivo

# Semente do sorteio. Vazia = aleatória a cada execução.
# Um número fixo (ex.: 42) reproduz a mesma sequência de decisões.
seed: ${DW_SEED:-}

# Lugar de referência do grafo: todo lugar com acesso "normal" precisa
# ter caminho até aqui.
lugar_central: town_square

relogio:
  # 1 = tempo real. 60 = uma hora do mundo por minuto real.
  # (o comando `python -m tools.run --speed N` sobrescreve)
  multiplicador: 1
  fuso: America/Sao_Paulo
  # quantos minutos do mundo cada passo ("tick") da simulação avança
  passo_minutos: 1
  dia_comeca: "06:00"
  noite_comeca: "18:30"
  # ao religar depois de um tempo desligado, simula no máximo estas horas
  # perdidas (rápido); o resto é pulado com um aviso no Chat do Mundo
  max_recuperacao_horas: 2
  # períodos do dia, em ordem (usados em condições de ações, falas e eventos)
  periodos:
    - {id: madrugada, nome: Madrugada, das: "00:00"}
    - {id: manha, nome: Manhã, das: "06:00"}
    - {id: tarde, nome: Tarde, das: "12:00"}
    - {id: noite, nome: Noite, das: "18:30"}

# Necessidades e humor. Valores de 0 a 100: quanto MAIOR, mais urgente.
#   modo acumula: sobe sozinha (taxa em pontos por hora do mundo)
#   modo retorna: volta devagar para a "base" (taxa = velocidade da volta)
# Cada personagem pode mudar o valor inicial e multiplicar a taxa no
# próprio arquivo (campo "necessidades"); os traços também multiplicam.
necessidades:
  fome:
    nome: Fome
    modo: acumula
    inicial: 30
    taxa_dia: 6
    taxa_noite: 3
    humor: faminto
  sono:
    nome: Sono
    modo: acumula
    inicial: 20
    taxa_dia: 3
    taxa_noite: 6
    humor: morto de sono
  social:
    nome: Solidão
    descricao: Vontade de estar com alguém e conversar.
    modo: acumula
    inicial: 30
    taxa_dia: 5
    taxa_noite: 2
    humor: carente de companhia
  fe:
    nome: Fé
    descricao: Vontade de rezar, de ritual, de sentir que tem algo maior.
    modo: acumula
    inicial: 20
    taxa_dia: 1.5
    taxa_noite: 1.5
    humor: precisando de um milagre
  tedio:
    nome: Tédio
    modo: acumula
    inicial: 30
    taxa_dia: 6
    taxa_noite: 4
    humor: entediado
  raiva:
    nome: Raiva
    modo: retorna
    base: 10
    inicial: 10
    taxa_dia: 8
    taxa_noite: 8
    humor: bufando de raiva
  medo:
    nome: Medo
    modo: retorna
    base: 5
    inicial: 5
    taxa_dia: 10
    taxa_noite: 6
    humor: tremendo de medo

# {humor} nas falas quando nenhuma necessidade passa de 60
humor_neutro: de boa

# Utility AI: como o NPC escolhe entre as ações (docs/arquitetura.md)
decisao:
  # sorteia entre as N melhores notas, proporcional à nota
  top_n: 3
  # 1 = proporcional; < 1 favorece mais a melhor; > 1 deixa mais caótico
  temperatura: 1.0
  # das N melhores, só sorteia as que valem pelo menos esta fração da melhor
  # (evita escolher algo bobo só porque estava em 3º lugar). 0 desliga.
  fracao_da_melhor: 0.4
  # ir até outro lugar: a nota cai pela metade a cada X minutos de viagem
  meia_vida_viagem_minutos: 20
  # multiplica a nota da ação que acabou de ser feita (evita repetir)
  penalidade_repeticao: 0.6
  # notas abaixo disso são descartadas
  nota_minima: 0.01
  # quem está ocupado olha em volta a cada N minutos do mundo e larga o que
  # está fazendo se a melhor opção valer `fator_interrupcao` vezes a atual E
  # pelo menos `nota_para_interromper` (é assim que alguém acorda para
  # trabalhar, ou o Padre larga tudo para tocar o sino)
  reavaliar_a_cada_minutos: 10
  fator_interrupcao: 3
  nota_para_interromper: 0.5
  # para ACORDAR alguém que está dormindo/cochilando o motivo precisa ser
  # mais forte (ex.: o trabalho com peso de rotina, o sino do Padre)
  nota_para_acordar: 2.0

# Limites e chances (fases 2 e 3 usam; ajuste para mudar o ritmo do mundo)
limites:
  max_populacao: 40
  min_populacao: 12
  max_figurantes: 8
  max_eventos_diretor_por_hora: 3
  max_eventos_diretor_por_dia: 20
  # chance BASE de morte, por personagem, por dia (causas somam por cima)
  chance_morte_por_dia: 0.004
  chance_fantasma_por_noite: 0.03
  chance_ressurreicao_natural_por_ano: 0.05
  intervalo_nascimento_dias: 10
  # chance de cada personagem parar e encarar a tela, por hora
  chance_olhar_por_hora: 0.02
  cooldown_aparicao_dias: 7
  horas_de_prisao: 12
  dias_no_limbo: 3
  minutos_de_chuva_no_funeral: 90

# Regiões agrupam lugares (só para organizar e para o visual)
regioes:
  city: {nome: A Cidade}
  biomes: {nome: Os Biomas}
  beyond: {nome: O Além}

# Grupos de personagens (nome editável)
grupos:
  cowboys: {nome: Os Cowboys}
  tecnicos: {nome: Os Técnicos}
  cozinha: {nome: O Casal da Cozinha}

# Categorias do Chat do Mundo (filtros). As ações e eventos marcam "tags"
# com estes ids.
categorias_chat:
  conversa: {nome: Conversa}
  briga: {nome: Briga}
  evento: {nome: Evento}
  seita: {nome: Seita}
  igreja: {nome: Igreja}
  morte: {nome: Morte}
  nascimento: {nome: Nascimento}
  trabalho: {nome: Trabalho}
  rotina: {nome: Rotina}
  movimento: {nome: Movimento}
  misterio: {nome: Mistério}
  clima: {nome: Clima}
  criador: {nome: Criador}
  sistema: {nome: Sistema}

# Clima real (Open-Meteo, grátis, sem chave). Fase 3.
clima:
  cidade: Botucatu-SP
  latitude: -22.886
  longitude: -48.445
  atualizar_minutos: 30
  timeout_segundos: 5
  cache_arquivo: var/clima.json
  # usado quando não há internet nem cache
  clima_padrao: nublado

# MQTT do homelab (Mosquitto). Se estiver fora do ar, o mundo continua.
mqtt:
  ativo: true
  host: ${MQTT_HOST:-mqtt.local}
  porta: ${MQTT_PORT:-1883}
  usuario: ${MQTT_USER:-}
  senha: ${MQTT_PASSWORD:-}
  client_id: divine-world
  estado_a_cada_minutos: 1
  reconectar_segundos: 30
  topicos:
    # publica
    eventos: world/events
    estado: world/state          # retido
    chat: world/chat
    tunel_leds: leds/tunnel
    status: world/status         # online/offline, retido, com Last Will
    # escuta
    comandos: world/commands
    presenca: sala/camera/pessoas
    homelab: homelab/servicos/#
    status_telas: telas/+/status # o + é o id da tela

# LLM local opcional (o "Oráculo"). Sem ele, tudo funciona com templates.
ollama:
  ativo: true
  url: ${OLLAMA_URL:-http://oraculo.local:11434}
  modelo: ${OLLAMA_MODEL:-qwen2.5:7b}
  timeout_segundos: 4
  max_por_hora: 30

# API HTTP + WebSocket (Fase 4)
servidor:
  host: ${DW_SERVER_HOST:-0.0.0.0}
  porta: ${DW_SERVER_PORT:-8000}

persistencia:
  banco: ${DW_DB_PATH:-var/world.sqlite}
  salvar_a_cada_minutos: 5

# Teletransporte entre telas: a luz de LED percorre a parede (Fase 5)
tunel:
  velocidade_led_cm_por_s: 60
  duracao_minima_s: 2

# Telas físicas na parede. Cada lugar aparece em no máximo UMA tela.
# Lugares fora de qualquer tela continuam existindo (o mundo vive mesmo
# sem ninguém olhando). Posição em cm a partir do canto inferior
# esquerdo da parede. Este é um EXEMPLO com 4 telas: ajuste ao seu quarto.
telas:
  - id: parede_centro
    nome: TV grande do centro
    lugares: [town_square, cathedral, town_hall, market, community_kitchen, tavern,
              forge, houses, prison, fields, cemetery]
    posicao_cm: {x: 150, y: 120}
    tamanho_cm: {largura: 120, altura: 70}
    fps_max: 30
    qualidade: media
  - id: monitor_esquerda
    nome: Monitor da esquerda
    lugares: [forest, mountain]
    posicao_cm: {x: 40, y: 140}
    tamanho_cm: {largura: 55, altura: 32}
    fps_max: 30
    qualidade: media
  - id: monitor_direita
    nome: Monitor da direita
    lugares: [sea, desert, sky]
    posicao_cm: {x: 320, y: 140}
    tamanho_cm: {largura: 55, altura: 32}
    fps_max: 30
    qualidade: media
  - id: tela_homelab
    nome: Tela transparente perto do homelab
    lugares: [server_room, underground]
    posicao_cm: {x: 420, y: 60}
    tamanho_cm: {largura: 30, altura: 20}
    fps_max: 20
    qualidade: baixa

nivel_log: info

# =====================================================================
# Fase 2 — sociedade: memória, fofoca, relações, leis, facções, estruturas
# =====================================================================

# Memórias: o que cada personagem lembra. Cada TIPO diz:
#   intensidade: força ao formar (0 a 100; quem só viu/ouviu lembra mais fraco)
#   sentimento: -1 (ruim) a +1 (bom)
#   decai_por_dia: quanto enfraquece por dia (some abaixo de esquecer_abaixo)
#   permanente: true = nunca esquece (Limbo, casamento; na Fase 3, mortes)
#   afinidade: quanto quem lembra passa a gostar (ou não) de quem fez
#   infracao: a lei vê isso como prova desta infração (contra quem fez)
#   fato: frase da FOFOCA ({quem} fez, {alvo} sofreu, {lugar}, {objeto})
#   lembranca: como quem viveu fala disso ("desde {lembranca}..."). Comece com
#              "aquele/aquela" (fica certo depois de "desde", "por", "sobre").
memoria:
  max_por_npc: 40
  esquecer_abaixo: 5
  fator_testemunha: 0.6
  fator_fofoca: 0.7
  tipos:
    briga:
      nome: Briga
      intensidade: 60
      sentimento: -0.8
      decai_por_dia: 15
      afinidade: -8
      infracao: brigar
      fato: "{quem} saiu no tapa com {alvo} em {lugar}"
      lembranca: "aquela briga em {lugar}"
    discussao:
      nome: Discussão
      intensidade: 35
      sentimento: -0.4
      decai_por_dia: 25
      afinidade: -3
      fato: "{quem} bateu boca com {alvo} em {lugar}"
      lembranca: "aquela discussão em {lugar}"
    pazes:
      nome: Pazes
      intensidade: 40
      sentimento: 0.7
      decai_por_dia: 15
      afinidade: 3
      fato: "{quem} fez as pazes com {alvo}, com abraço e tudo"
      lembranca: "aquele dia em que a gente fez as pazes em {lugar}"
    pegadinha:
      nome: Pegadinha
      intensidade: 45
      sentimento: -0.5
      decai_por_dia: 20
      afinidade: -6
      infracao: baderna
      fato: "{quem} pregou uma peça em {alvo} em {lugar}"
      lembranca: "aquela pegadinha em {lugar}"
    tombo:
      nome: Tombo
      intensidade: 30
      sentimento: 0.2
      decai_por_dia: 25
      fato: "{quem} levou um tombo ridículo em {lugar}"
      lembranca: "aquele tombo em {lugar}"
    roubo:
      nome: Roubo
      intensidade: 70
      sentimento: -0.9
      decai_por_dia: 6
      afinidade: -10
      infracao: roubar
      fato: "{quem} roubou {objeto} em {lugar}"
      lembranca: "aquele sumiço de {objeto} em {lugar}"
    sumico:
      nome: Suspeita de roubo
      intensidade: 55
      sentimento: -0.7
      decai_por_dia: 8
      afinidade: -12
      infracao: roubar
      fato: "{quem} pegou {objeto} de {lugar}, certeza"
      lembranca: "aquele sumiço de {objeto} em {lugar}"
    pichacao:
      nome: Pichação
      intensidade: 35
      sentimento: -0.3
      decai_por_dia: 12
      afinidade: -2
      infracao: pichar
      fato: "{quem} pichou {lugar} e ainda assinou"
      lembranca: "aquela pichação em {lugar}"
    quebra:
      nome: Quebradeira
      intensidade: 45
      sentimento: -0.6
      decai_por_dia: 12
      afinidade: -5
      infracao: quebrar
      fato: "{quem} quebrou tudo em {lugar}"
      lembranca: "aquela quebradeira em {lugar}"
    barulho:
      nome: Barulheira
      intensidade: 25
      sentimento: -0.2
      decai_por_dia: 30
      infracao: barulho
      fato: "{quem} fez uma barulheira danada em {lugar} de madrugada"
      lembranca: "aquela barulheira em {lugar}"
    prisao:
      nome: Prisão
      intensidade: 65
      sentimento: -0.7
      decai_por_dia: 6
      afinidade: -15
      fato: "{alvo} foi parar atrás das grades por causa de {quem}"
      lembranca: "aquela prisão em {lugar}"
    limbo:
      nome: Limbo
      intensidade: 95
      sentimento: -1
      permanente: true
      afinidade: -30
      fato: "{alvo} foi mandado pro Limbo por {quem}"
      lembranca: "aquele silêncio branco do Limbo"
    festa:
      nome: Festa boa
      intensidade: 50
      sentimento: 0.8
      decai_por_dia: 10
      afinidade: 4
      fato: "{quem} deu uma festa daquelas em {lugar}"
      lembranca: "aquela festa em {lugar}"
    festa_fracassada:
      nome: Festa furada
      intensidade: 45
      sentimento: -0.5
      decai_por_dia: 10
      fato: "ninguém foi na festa de {quem} em {lugar}"
      lembranca: "aquela festa furada em {lugar}"
    ritual:
      nome: Ritual
      intensidade: 45
      sentimento: 0.5
      decai_por_dia: 12
      afinidade: 3
      fato: "{quem} acendeu velas e chamou as vozes em {lugar}"
      lembranca: "aquele ritual em {lugar}"
    ritual_visto:
      nome: Ritual espiado
      intensidade: 50
      sentimento: -0.5
      decai_por_dia: 10
      afinidade: -4
      fato: "{quem} anda fazendo ritual de madrugada em {lugar}"
      lembranca: "aquilo que vi em {lugar} naquela noite"
    missa:
      nome: Missa
      intensidade: 25
      sentimento: 0.4
      decai_por_dia: 20
      afinidade: 2
      fato: "{quem} rezou uma missa bonita em {lugar}"
      lembranca: "aquela missa em {lugar}"
    conversao:
      nome: Mudou de lado
      intensidade: 60
      sentimento: -0.3
      decai_por_dia: 4
      fato: "{quem} agora anda com {objeto}"
      lembranca: "aquele dia em que {quem} entrou para {objeto}"
    casamento:
      nome: Casamento
      intensidade: 90
      sentimento: 1
      permanente: true
      afinidade: 10
      fato: "{quem} casou com {alvo} em {lugar}"
      lembranca: "aquele casamento em {lugar}"
    consolo:
      nome: Consolo
      intensidade: 40
      sentimento: 0.8
      decai_por_dia: 12
      afinidade: 5
      fato: "{quem} consolou {alvo} em {lugar}"
      lembranca: "aquele abraço em {lugar}"
    choque:
      nome: Choque
      intensidade: 35
      sentimento: 0.1
      decai_por_dia: 20
      fato: "{quem} levou um choque em {lugar} e ficou com o cabelo em pé"
      lembranca: "aquele choque em {lugar}"
    achado:
      nome: Achado
      intensidade: 30
      sentimento: 0.3
      decai_por_dia: 15
      fato: "{quem} achou {objeto} jogado em {lugar}"
      lembranca: "aquele dia em que apareceu {objeto}"
    achado_sagrado:
      nome: Achado sagrado
      intensidade: 55
      sentimento: 0.5
      decai_por_dia: 5
      fato: "{quem} achou {objeto} em {lugar} e jura que é sagrado"
      lembranca: "aquele achado sagrado em {lugar}"
    mutirao:
      nome: Mutirão
      intensidade: 40
      sentimento: 0.6
      decai_por_dia: 10
      afinidade: 3
      fato: "{quem} juntou gente para consertar {lugar}"
      lembranca: "aquele mutirão em {lugar}"

fofoca:
  # chance de a fofoca chegar torta (troca quem fez por outra pessoa).
  # Quem tem o traço abaixo distorce o dobro e conta segredos de confissão.
  chance_distorcao: 0.2
  traco_fofoqueiro: fofoqueiro

relacoes:
  # pontos de afinidade por hora que voltam em direção ao valor inicial
  retorno_por_hora: 0.2
  # anuncia no Chat quando um par cruza estes limites
  inimigos_abaixo: -50
  amigos_acima: 60

# Leis: o Fiscal registra as infrações. Pontos somam pela gravidade:
# abaixo de pontos_para_prisao = advertência; a partir disso, prisão
# (limites.horas_de_prisao); a partir de pontos_para_limbo, o Limbo
# (limites.dias_no_limbo; volta com um traço novo sorteado).
leis:
  profissao_fiscal: fiscal
  infracoes:
    pichar: {nome: pichação, gravidade: 1}
    roubar: {nome: roubo, gravidade: 2}
    barulho: {nome: barulho, gravidade: 0.5, horarios: [{das: "22:00", ate: "06:00"}]}
    brigar: {nome: briga, gravidade: 1.5}
    quebrar: {nome: quebra-quebra, gravidade: 2}
    baderna: {nome: baderna, gravidade: 1}
  pontos_para_prisao: 2
  pontos_para_limbo: 6
  pontos_somem_por_dia: 1
  mandado_horas: 24
  # a mesma pessoa pela mesma infração não é registrada de novo antes disso
  reincidencia_horas: 6
  # numa olhada só, o Fiscal registra no máximo esta quantidade de flagrantes
  max_por_olhada: 2
  prisao: prison
  limbo: limbo
  volta_do_limbo: town_square
  # o que o preso pode fazer na cela, além do que a Prisão oferece (a gororoba)
  acoes_na_prisao: [comer]
  acao_fuga: fugir
  acao_perseguicao: perseguir

# Facções: disputam fiéis pela afinidade com o líder.
faccoes:
  igreja:
    nome: A Igreja
    lider: priest
    afinidade_para_entrar: 55
    afinidade_para_sair: -10
  seita:
    nome: A Seita
    lider: medium
    afinidade_para_entrar: 62
    afinidade_para_sair: -10

estruturas:
  # abaixo disso a estrutura está "danificada"; em 0, "destruída"
  danificado_abaixo: 70

# Ganância: o que acontece com o que é roubado
roubos:
  chance_testemunha_notar: 0.6
  chance_esquecer: 0.35
  chance_achar: 0.3
  tracos_que_acham_sagrado: [estranho]
  raiva_ao_perceber: 30
