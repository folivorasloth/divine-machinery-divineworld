# =====================================================================
# world.yaml — configuração geral do Mundo Vivo
# =====================================================================
# Tudo aqui pode ser editado à mão. Depois de editar, rode:
#     python -m tools.validate
#
# Endereços e senhas NÃO ficam escritos aqui (o repositório é público):
# use ${VARIAVEL:-padrão}. O valor vem da variável de ambiente (ou do
# arquivo .env no docker compose); se ela não existir, vale o padrão.
# Veja .env.example.
# =====================================================================

nome: Divine Machinery — o Mundo Vivo

# Semente do sorteio. Vazia = aleatória a cada execução.
# Um número fixo (ex.: 42) reproduz a mesma sequência de decisões.
seed: ${DW_SEED:-}

# Lugar de referência do grafo: todo lugar com acesso "normal" precisa
# ter caminho até aqui.
lugar_central: town_square

relogio:
  # 1 = tempo real. 60 = uma hora do mundo por minuto real.
  # (o comando `python -m tools.run --speed N` sobrescreve)
  multiplicador: 1
  fuso: America/Sao_Paulo
  # quantos minutos do mundo cada passo ("tick") da simulação avança
  passo_minutos: 1
  dia_comeca: "06:00"
  noite_comeca: "18:30"
  # ao religar depois de um tempo desligado, simula no máximo estas horas
  # perdidas (rápido); o resto é pulado com um aviso no Chat do Mundo
  max_recuperacao_horas: 2
  # períodos do dia, em ordem (usados em condições de ações, falas e eventos)
  periodos:
    - {id: madrugada, nome: Madrugada, das: "00:00"}
    - {id: manha, nome: Manhã, das: "06:00"}
    - {id: tarde, nome: Tarde, das: "12:00"}
    - {id: noite, nome: Noite, das: "18:30"}

# Necessidades e humor. Valores de 0 a 100: quanto MAIOR, mais urgente.
#   modo acumula: sobe sozinha (taxa em pontos por hora do mundo)
#   modo retorna: volta devagar para a "base" (taxa = velocidade da volta)
# Cada personagem pode mudar o valor inicial e multiplicar a taxa no
# próprio arquivo (campo "necessidades"); os traços também multiplicam.
necessidades:
  fome:
    nome: Fome
    modo: acumula
    inicial: 30
    taxa_dia: 6
    taxa_noite: 3
    humor: faminto
  sono:
    nome: Sono
    modo: acumula
    inicial: 20
    taxa_dia: 3
    taxa_noite: 6
    humor: morto de sono
  social:
    nome: Solidão
    descricao: Vontade de estar com alguém e conversar.
    modo: acumula
    inicial: 30
    taxa_dia: 5
    taxa_noite: 2
    humor: carente de companhia
  fe:
    nome: Fé
    descricao: Vontade de rezar, de ritual, de sentir que tem algo maior.
    modo: acumula
    inicial: 20
    taxa_dia: 1.5
    taxa_noite: 1.5
    humor: precisando de um milagre
  tedio:
    nome: Tédio
    modo: acumula
    inicial: 30
    taxa_dia: 6
    # Fase 6: era 4 — a noite é quase toda de sono; com 4 a cidade acordava entediada
    taxa_noite: 2
    humor: entediado
  raiva:
    nome: Raiva
    modo: retorna
    base: 10
    inicial: 10
    taxa_dia: 8
    taxa_noite: 8
    humor: bufando de raiva
  medo:
    nome: Medo
    modo: retorna
    base: 5
    inicial: 5
    taxa_dia: 10
    taxa_noite: 6
    humor: tremendo de medo

# {humor} nas falas quando nenhuma necessidade passa de 60
humor_neutro: de boa

# Utility AI: como o NPC escolhe entre as ações (docs/arquitetura.md)
decisao:
  # sorteia entre as N melhores notas, proporcional à nota
  top_n: 3
  # 1 = proporcional; < 1 favorece mais a melhor; > 1 deixa mais caótico
  temperatura: 1.0
  # das N melhores, só sorteia as que valem pelo menos esta fração da melhor
  # (evita escolher algo bobo só porque estava em 3º lugar). 0 desliga.
  fracao_da_melhor: 0.4
  # ir até outro lugar: a nota cai pela metade a cada X minutos de viagem
  meia_vida_viagem_minutos: 20
  # multiplica a nota da ação que acabou de ser feita (evita repetir)
  penalidade_repeticao: 0.6
  # notas abaixo disso são descartadas
  nota_minima: 0.01
  # quem está ocupado olha em volta a cada N minutos do mundo e larga o que
  # está fazendo se a melhor opção valer `fator_interrupcao` vezes a atual E
  # pelo menos `nota_para_interromper` (é assim que alguém acorda para
  # trabalhar, ou o Padre larga tudo para tocar o sino)
  reavaliar_a_cada_minutos: 10
  fator_interrupcao: 3
  nota_para_interromper: 0.5
  # para ACORDAR alguém que está dormindo/cochilando o motivo precisa ser
  # mais forte (ex.: o trabalho com peso de rotina, o sino do Padre)
  nota_para_acordar: 2.0

# Limites e chances (fases 2 e 3 usam; ajuste para mudar o ritmo do mundo)
limites:
  max_populacao: 40
  min_populacao: 12
  max_figurantes: 8
  max_eventos_diretor_por_hora: 3
  max_eventos_diretor_por_dia: 20
  # chance BASE de morte "de velhice / de repente", por personagem, por dia
  # (é a causa morte.causas.velhice; as outras causas têm chance própria).
  # Ninguém morre por acaso se a cidade estiver com min_populacao vivos.
  chance_morte_por_dia: 0.0013
  # Fase 6: sem morte natural se alguém morreu há menos destes dias (as mortes vinham
  # em rajadas: 3 em 4 dias). Briga, acidente, choque e criatura continuam valendo.
  dias_minimos_entre_mortes_naturais: 8
  # Fase 6: teto de mortes por semana (qualquer causa sorteada: velhice, briga, acidente,
  # choque, criatura, Limbo). Com 2 mortes nos últimos 7 dias, ninguém mais morre por acaso
  # até a mais antiga sair da janela: o acidente/choque/briga acontece, mas a pessoa sobrevive.
  # Rodadas de 60 dias tinham "rajadas" de 3 a 5 mortes numa semana. 0 = sem teto.
  # causas_fora_do_limite: causas que matam mesmo com o teto cheio (ids de morte.causas).
  max_mortes_em_7_dias: 2
  causas_fora_do_limite: []
  # chance de UM fantasma aparecer, por noite (se houver mortos que amavam ou
  # odiavam alguém vivo)
  chance_fantasma_por_noite: 0.12
  chance_ressurreicao_natural_por_ano: 0.05
  # em média, um nascimento a cada N dias (mais rápido quando há vagas abertas
  # por mortes recentes: vida.bonus_por_vaga; nunca acima de max_populacao)
  # Fase 6: era 9 — no teste de 60 dias nasceram 10 e morreram 4 (a cidade ia de 21 para 28);
  # com 12 a população fica mais estável
  intervalo_nascimento_dias: 12
  # chance de cada personagem parar e encarar a tela, por hora
  chance_olhar_por_hora: 0.02
  cooldown_aparicao_dias: 7
  horas_de_prisao: 12
  dias_no_limbo: 3
  minutos_de_chuva_no_funeral: 90

# Regiões agrupam lugares (só para organizar e para o visual)
regioes:
  city: {nome: A Cidade}
  biomes: {nome: Os Biomas}
  beyond: {nome: O Além}

# Grupos de personagens (nome editável)
grupos:
  cowboys: {nome: Os Cowboys}
  tecnicos: {nome: Os Técnicos}
  cozinha: {nome: O Casal da Cozinha}

# Categorias do Chat do Mundo (filtros). As ações e eventos marcam "tags"
# com estes ids.
categorias_chat:
  conversa: {nome: Conversa}
  briga: {nome: Briga}
  evento: {nome: Evento}
  seita: {nome: Seita}
  igreja: {nome: Igreja}
  morte: {nome: Morte}
  nascimento: {nome: Nascimento}
  trabalho: {nome: Trabalho}
  rotina: {nome: Rotina}
  movimento: {nome: Movimento}
  misterio: {nome: Mistério}
  clima: {nome: Clima}
  criador: {nome: Criador}
  sistema: {nome: Sistema}

# Clima (Fase 3). De onde vem:
#   auto     = clima REAL de Botucatu (Open-Meteo) quando o mundo está no relógio
#              real; SORTEADO quando o tempo está acelerado (--fast, --speed, testes)
#   real     = sempre pergunta ao Open-Meteo (sem internet: cache, depois clima_padrao)
#   simulado = sempre sorteado (com a seed do mundo)
#   fixo     = sempre o clima_padrao
# No funeral SEMPRE chove (clima_do_funeral), seja qual for o clima de verdade.
clima:
  modo: auto
  cidade: Botucatu-SP
  latitude: -22.886
  longitude: -48.445
  url: https://api.open-meteo.com/v1/forecast
  atualizar_minutos: 30
  timeout_segundos: 5
  cache_arquivo: ${DW_WEATHER_CACHE:-var/clima.json}
  # usado quando não há internet nem cache (id de "tipos" abaixo)
  clima_padrao: nublado
  clima_do_funeral: chuva
  # tipos de clima: nome (vira {clima} nas falas) e códigos WMO do Open-Meteo
  tipos:
    limpo: {nome: céu limpo, codigos: [0, 1]}
    nublado: {nome: nublado, codigos: [2, 3]}
    neblina: {nome: neblina, codigos: [45, 48]}
    garoa: {nome: garoa, codigos: [51, 53, 55, 56, 57], chuva: true}
    chuva: {nome: chuva, codigos: [61, 63, 65, 66, 67, 80, 81, 82], chuva: true}
    tempestade: {nome: tempestade, codigos: [95, 96, 99], chuva: true}
  # clima sorteado (tempo acelerado): troca a cada X horas, com estes pesos
  # (um pouco de primavera de Botucatu: sol, nuvem e pancada de chuva)
  simulado:
    troca_a_cada_horas: [2, 7]
    pesos: {limpo: 4, nublado: 4, neblina: 0.6, garoa: 1, chuva: 1.4, tempestade: 0.4}
    temperatura_dia: [19, 32]
    temperatura_noite: [12, 21]
  frio_abaixo: 14
  calor_acima: 30
  # o que cada clima faz. necessidades: multiplica a taxa; acoes: multiplica a
  # nota; acoes_externas: multiplica a nota de QUALQUER ação em lugar externo
  efeitos:
    chuva:
      necessidades: {tedio: 1.2, social: 1.1}
      acoes: {perambular: 0.5, festejar: 0.8, rezar: 1.2}
      acoes_externas: 0.55
    garoa:
      acoes: {perambular: 0.8}
      acoes_externas: 0.8
    tempestade:
      necessidades: {tedio: 1.3}
      acoes: {perambular: 0.2, rezar: 1.5}
      acoes_externas: 0.3
    neblina:
      acoes: {encarar_tela: 1.4}
      acoes_externas: 0.85
    limpo:
      acoes: {perambular: 1.2, festejar: 1.1}
    frio:
      necessidades: {fome: 1.2, sono: 1.1}
      acoes_externas: 0.8
    calor:
      necessidades: {sono: 1.15, tedio: 1.1}
      acoes: {festejar: 1.2, cochilar: 1.3}
  # quem tem medo do clima (medos.gatilho: chuva, como o Esquisito) ganha
  # este tanto de medo por hora enquanto ele dura
  medo_por_hora_com_gatilho: 25

# MQTT do homelab (Mosquitto). Se estiver fora do ar, o mundo continua.
mqtt:
  ativo: true
  host: ${MQTT_HOST:-mqtt.local}
  porta: ${MQTT_PORT:-1883}
  usuario: ${MQTT_USER:-}
  senha: ${MQTT_PASSWORD:-}
  client_id: divine-world
  estado_a_cada_minutos: 1
  reconectar_segundos: 30
  topicos:
    # publica
    eventos: world/events
    estado: world/state          # retido
    chat: world/chat
    tunel_leds: leds/tunnel
    status: world/status         # online/offline, retido, com Last Will
    # escuta
    comandos: world/commands
    presenca: sala/camera/pessoas
    homelab: homelab/servicos/#
    status_telas: telas/+/status # o + é o id da tela
    # publica: resposta de cada comando recebido em world/commands
    respostas: world/commands/result

# LLM local opcional (o "Oráculo"). Sem ele, tudo funciona com templates.
# Só é usado com o mundo no relógio real (python -m server, velocidade 1); no
# tempo acelerado e nos testes, nunca. Se o Ollama não responder em
# timeout_segundos, ou passar de max_por_hora, a fala sai do template de sempre.
ollama:
  ativo: ${DW_OLLAMA_ATIVO:-true}
  url: ${OLLAMA_URL:-http://oraculo.local:11434}
  modelo: ${OLLAMA_MODEL:-qwen2.5:7b}
  timeout_segundos: 4
  max_por_hora: 30
  checar_a_cada_segundos: 60
  max_caracteres: 220
  # falas que o LLM pode reescrever (só as de importância >= importancia_min)
  importancia_min: 1
  situacoes: [morte_briga, morte_velhice, morte_acidente, morte_choque, morte_criatura, morte_limbo,
              funeral_personalidade, funeral_amigo, funeral_inimigo, funeral_anuncio, epitafio,
              ressurreicao_criador, ressurreicao_padre, ressurreicao_medium,
              ordem_intuicao, ordem_anuncio, ordem_cumprida, ordem_resiste,
              voz_recebida, visao_anuncio, aparicao_padre, aparicao_seita, aparicao_esquisito,
              virou_inimigo, virou_amigo]
  # também tenta entender ordens livres do Criador (sem palavra-chave conhecida)
  interpretar_ordens: true

# API HTTP + WebSocket (Fase 4)
servidor:
  host: ${DW_SERVER_HOST:-0.0.0.0}
  porta: ${DW_SERVER_PORT:-8000}

persistencia:
  banco: ${DW_DB_PATH:-var/world.sqlite}
  salvar_a_cada_minutos: 5

# Teletransporte entre telas: a luz de LED percorre a parede (Fase 5)
tunel:
  velocidade_led_cm_por_s: 60
  duracao_minima_s: 2

# Telas físicas na parede. Cada lugar aparece em no máximo UMA tela.
# Lugares fora de qualquer tela continuam existindo (o mundo vive mesmo
# sem ninguém olhando). Posição em cm a partir do canto inferior
# esquerdo da parede. Este é um EXEMPLO com 4 telas: ajuste ao seu quarto.
telas:
  - id: parede_centro
    nome: TV grande do centro
    lugares: [town_square, cathedral, town_hall, market, community_kitchen, tavern,
              forge, houses, prison, fields, cemetery]
    posicao_cm: {x: 150, y: 120}
    tamanho_cm: {largura: 120, altura: 70}
    fps_max: 30
    qualidade: media
  - id: monitor_esquerda
    nome: Monitor da esquerda
    lugares: [forest, mountain]
    posicao_cm: {x: 40, y: 140}
    tamanho_cm: {largura: 55, altura: 32}
    fps_max: 30
    qualidade: media
  - id: monitor_direita
    nome: Monitor da direita
    lugares: [sea, desert, sky]
    posicao_cm: {x: 320, y: 140}
    tamanho_cm: {largura: 55, altura: 32}
    fps_max: 30
    qualidade: media
  - id: tela_homelab
    nome: Tela transparente perto do homelab
    lugares: [server_room, underground]
    posicao_cm: {x: 420, y: 60}
    tamanho_cm: {largura: 30, altura: 20}
    fps_max: 20
    qualidade: baixa

# =====================================================================
# Fase 5 — o visual (viewer 3D, uma página por tela: /viewer/?screen=<id>)
# =====================================================================
# Só as telas usam isto; a simulação ignora. Cada tela escolhe o nível em
# telas[].qualidade (baixa | media | alta) e o limite em telas[].fps_max.
# Para testar sem editar: /viewer/?screen=parede_centro&qualidade=alta&fps=60
visual:
  qualidades:
    baixa:   # notebook ou celular velho
      altura_render: 160      # pixels de altura da imagem interna (PS1 = 240)
      gotas_de_chuva: 120
      tremer_vertices: true   # a "tremidinha" dos vértices do PS1
      luzes_extras: 0         # luzes de verdade de lampião/forja (pesam)
      detalhe: 0.5            # menos árvores, pedras e enfeites
    media:
      altura_render: 240
      gotas_de_chuva: 400
      tremer_vertices: true
      luzes_extras: 0
      detalhe: 1.0
    alta:
      altura_render: 360
      gotas_de_chuva: 900
      tremer_vertices: true
      luzes_extras: 6
      detalhe: 1.3
  # balões de fala: duração = mínimo + letras × segundos_por_letra (até o máximo)
  baloes:
    segundos_minimos: 2.5
    segundos_por_letra: 0.06
    segundos_maximos: 9
    max_letras: 90            # texto maior é encurtado com "…" (o Chat do Mundo tem o inteiro)
  # tamanho dos personagens em relação ao cenário (1 = tamanho real, 1,7 m;
  # maior = mais fácil de ver do outro lado do quarto). Vale também para os .glb.
  escala_personagens: 1.3
  mostrar_nomes: true         # plaquinha com o nome embaixo de cada um
  mostrar_relogio: true       # hora e clima no canto da tela
  nevoa_comeca: 1.2           # névoa de distância (em tamanhos do cenário)
  nevoa_termina: 3.0
  # Que animação cada ação usa. Nomes possíveis (os mesmos dos .glb, ver
  # docs/guias/06_modelos_3d_e_design.md): idle walk talk work sleep fall
  # fight pray dance stare. Ação que não está aqui = idle.
  animacao_por_acao:
    andar: walk
    viajar: walk
    perambular: walk
    fugir: walk
    perseguir: walk
    patrulhar: walk
    andar_de_skate: walk
    trabalhar: work
    comer: work
    tocar_sino: work
    construir: work
    pichar: work
    fucar: work
    roubar: work
    pregar_peca: work
    fazer_malabarismo: work
    dormir: sleep
    cochilar: sleep
    encarar_tela: stare
    espiar_seita: stare
    conversar: talk
    discutir: talk
    fofocar: talk
    consolar: talk
    pedir_desculpas: talk
    confessar: talk
    recrutar: talk
    pregar: talk
    denunciar: talk
    anunciar_ordem: talk
    reuniao: talk
    assembleia: talk
    mandar_reconstruir: talk
    rezar: pray
    missa: pray
    ritual: pray
    participar_ritual: pray
    revelar_visao: pray
    velar: pray
    visitar_tumulo: pray
    festejar: dance
    brigar: fight
    quebrar: fight
    prender: fight
    enfrentar: fight
  # eventos que interrompem a animação por alguns segundos (tombo, briga, o olhar)
  animacao_por_evento:
    slapstick: fall
    fight: fight
    creature_fight: fight
    stare: stare
    death: fall
    prank: work
  # se o .glb do personagem não tiver a animação, tenta estas (na ordem);
  # se nenhuma existir, o viewer faz um movimento procedural por cima do idle
  animacao_substituta:
    talk: [idle]
    work: [talk, idle]
    fight: [work, idle]
    dance: [walk, idle]
    pray: [idle]
    stare: [idle]
    sleep: [idle]
    fall: [idle]
    walk: [idle]

nivel_log: info

# =====================================================================
# Fase 2 — sociedade: memória, fofoca, relações, leis, facções, estruturas
# =====================================================================

# Memórias: o que cada personagem lembra. Cada TIPO diz:
#   intensidade: força ao formar (0 a 100; quem só viu/ouviu lembra mais fraco)
#   sentimento: -1 (ruim) a +1 (bom)
#   decai_por_dia: quanto enfraquece por dia (some abaixo de esquecer_abaixo)
#   permanente: true = nunca esquece (Limbo, casamento; na Fase 3, mortes)
#   afinidade: quanto quem lembra passa a gostar (ou não) de quem fez
#   infracao: a lei vê isso como prova desta infração (contra quem fez)
#   fato: frase da FOFOCA ({quem} fez, {alvo} sofreu, {lugar}, {objeto})
#   lembranca: como quem viveu fala disso ("desde {lembranca}..."). Comece com
#              "aquele/aquela" (fica certo depois de "desde", "por", "sobre").
memoria:
  max_por_npc: 40
  esquecer_abaixo: 5
  fator_testemunha: 0.6
  fator_fofoca: 0.7
  tipos:
    briga:
      nome: Briga
      intensidade: 60
      sentimento: -0.8
      decai_por_dia: 15
      afinidade: -8
      infracao: brigar
      fato: "{quem} saiu no tapa com {alvo} em {lugar}"
      lembranca: "aquela briga em {lugar}"
    discussao:
      nome: Discussão
      intensidade: 35
      sentimento: -0.4
      decai_por_dia: 25
      afinidade: -3
      fato: "{quem} bateu boca com {alvo} em {lugar}"
      lembranca: "aquela discussão em {lugar}"
    pazes:
      nome: Pazes
      intensidade: 40
      sentimento: 0.7
      decai_por_dia: 15
      afinidade: 3
      fato: "{quem} fez as pazes com {alvo}, com abraço e tudo"
      lembranca: "aquele dia em que a gente fez as pazes em {lugar}"
    pegadinha:
      nome: Pegadinha
      intensidade: 45
      sentimento: -0.5
      decai_por_dia: 20
      afinidade: -6
      infracao: baderna
      fato: "{quem} pregou uma peça em {alvo} em {lugar}"
      lembranca: "aquela pegadinha em {lugar}"
    tombo:
      nome: Tombo
      intensidade: 30
      sentimento: 0.2
      decai_por_dia: 25
      fato: "{quem} levou um tombo ridículo em {lugar}"
      lembranca: "aquele tombo em {lugar}"
    roubo:
      nome: Roubo
      intensidade: 70
      sentimento: -0.9
      decai_por_dia: 6
      afinidade: -10
      infracao: roubar
      fato: "{quem} roubou {objeto} em {lugar}"
      lembranca: "aquele sumiço de {objeto} em {lugar}"
    sumico:
      nome: Suspeita de roubo
      intensidade: 55
      sentimento: -0.7
      decai_por_dia: 8
      afinidade: -12
      infracao: roubar
      fato: "{quem} pegou {objeto} de {lugar}, certeza"
      lembranca: "aquele sumiço de {objeto} em {lugar}"
    pichacao:
      nome: Pichação
      intensidade: 35
      sentimento: -0.3
      decai_por_dia: 12
      afinidade: -2
      infracao: pichar
      fato: "{quem} pichou {lugar} e ainda assinou"
