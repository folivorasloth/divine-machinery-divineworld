    texto: "Uma música que ninguém está tocando sai de {lugar}. É bonita. Ninguém pergunta de onde vem."
    importancia: 1
    tags: [misterio]

  - id: chuva_mansa
    nome: Chuva mansa
    tipo: clima
    tensao: acalma
    peso: 0.6
    cooldown_horas: 30
