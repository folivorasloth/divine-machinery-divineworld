  - id: desenho_do_criador
    nome: A figura desenhada
    descricao: O personagem raro desenhado pelo João. Ficha em branco até o desenho existir.
    tipo: lendario
    cooldown_horas: 720
    chance_por_dia: 0.01
    lugares: [town_square, market, cathedral, fields]
    condicoes:
      periodos: [manha, tarde]
    efeitos:
      necessidades: {medo: 20, fe: 30, tedio: -40}
      necessidades_para: todos
      objetivo: {acao: encarar_tela, bonus: 6, duracao_horas: 1, para: todos}
      memoria: aparicao_rara
    texto: "Em {lugar} aparece uma figura que parece desenhada à mão, com traços tremidos. A cidade inteira para e olha. Depois de um minuto, ela some."
    importancia: 3
    tags: [misterio]
