    tags: [evento]

  - id: musica_na_praca
    nome: Música na praça
    tipo: ritmo
    tensao: acalma
    peso: 0.8
    cooldown_horas: 24
    lugares: [town_square]
    condicoes:
      periodos: [tarde, noite]
