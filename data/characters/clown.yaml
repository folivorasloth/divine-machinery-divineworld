id: clown
nome: O Palhaço
pronome: ele
papel: Engraçado · zoa todos
aparencia: Magro, macacão de bolinhas desbotado, nariz vermelho rachado, sapatos enormes, maquiagem borrada de quem não lava o rosto há dias.
movimento: Saltitando e dando estrelinhas. Às vezes para no meio do nada e encara alguém por tempo demais.
