        curva: {tipo: pontos, pontos: [[0, 0], [8, 0.3], [30, 1]]}
      - entrada: afinidade_inicial
        curva: {tipo: pontos, pontos: [[-100, 0], [0, 0], [20, 0.1], [50, 0.6], [80, 1]]}
      - entrada: necessidade.raiva
        curva: {tipo: pontos, pontos: [[0, 1], [50, 0.5], [80, 0.05]]}
    efeitos:
      necessidades: {raiva: -15, social: -10}
      alvo_necessidades: {raiva: -25}
      afinidade: 7
      afinidade_do_alvo: 7
    reconcilia: true
    memoria: pazes
    evento: reconcile
    narracao: "{eu} abraça {outro}."
    fala: abraco
    chance_fala: 0.9
    fala_alvo: resposta_abraco
    chance_fala_alvo: 0.5
    tags: [conversa]
    importancia: 1

