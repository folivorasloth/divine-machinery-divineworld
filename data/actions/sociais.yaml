# Ações sociais e de conflito. Formato explicado no topo de basicas.yaml.
# Ações "social" precisam de um alvo no mesmo lugar (condicoes.alvo) e
# podem usar as entradas `afinidade` e `alvo_necessidade.<id>`.
#
# Campos da Fase 2 (sociedade) — todos opcionais:
#   ir_atras: true        ← vale ir atrás do alvo em outro lugar (desculpas, prender)
#   memoria: briga        ← o alvo e quem viu lembram disso (world.yaml > memoria.tipos)
#   infracao: brigar      ← é infração: o Fiscal registra se vir (world.yaml > leis)
#   interrompe_alvo: true ← o alvo larga o que fazia e sente o efeito na hora
#   reacao_alvo: emburrar ← ...e reage com esta ação automática (fica emburrado uns minutos)
#   reconcilia: true      ← faz as pazes: as memórias ruins entre os dois enfraquecem
#   chance_perseguicao: 0.3  ← no fim, o alvo sai correndo e quem fez vai atrás
#   falha: {chance, efeitos, fala, memoria}  ← pastelão: dá errado (traços mudam a chance)
#   evento: fight | argument | reconcile | gossip | prank | theft | faction | ritual...
#           ← tipo do evento no Chat do Mundo (para filtros e contagens)
#   especial: fofoca | confissao | denuncia | prender | roubar | recrutar | ordem_reconstruir
#           ← regra pronta no código (ver docs/arquitetura.md, seção 11)
#   efeitos.afinidade_com: {priest: 2}   ← muda a afinidade com alguém específico
#   efeitos.por_traco: {briguento: {raiva: 30}}  ← efeito extra para quem tem o traço
#   efeitos.dano_estrutura: 10  ← estraga uma estrutura do lugar (ao terminar)
# Entradas novas das considerações: afinidade_inicial, afinidade_com.<id>,
# presenca.<id>, faccao.<id>, conflito_alvo, memoria.<tipo>, memoria_alvo.<tipo>,
# fofoca, denuncia, dano, dano_cidade, mandado.

acoes:
  - id: conversar
    nome: Conversar
    descricao: Conversa com alguém no mesmo lugar.
    tipo: social
    peso: 1.0
    duracao_minutos: [5, 20]
    em_qualquer_lugar: true
    condicoes:
      alvo: {obrigatorio: true, afinidade_min: -60}
    consideracoes:
      - entrada: necessidade.social
        curva: {tipo: pontos, pontos: [[0, 0.05], [40, 0.4], [80, 1]]}
      - entrada: afinidade
        curva: {tipo: pontos, pontos: [[-100, 0.05], [0, 0.5], [100, 1]]}
    efeitos:
      necessidades: {social: -25, tedio: -10}
      alvo_necessidades: {social: -20}
      afinidade: 1
      afinidade_do_alvo: 1
    narracao: "{eu} puxa conversa com {outro}."
    fala: conversa
    chance_fala: 0.9
    fala_alvo: resposta
    chance_fala_alvo: 0.6
    tags: [conversa]

  - id: festejar
    nome: Festejar
    descricao: Dança, canta, bebe. Melhor à noite e com gente em volta.
    tipo: individual
    peso: 0.7
    duracao_minutos: [30, 120]
    consideracoes:
      - entrada: necessidade.tedio
        curva: {tipo: linear, minimo: 0.1}
      - entrada: presentes
        curva: {tipo: pontos, pontos: [[0, 0.1], [3, 0.6], [8, 1]]}
      - entrada: hora
        curva: {tipo: pontos, pontos: [[0, 0.8], [3, 0.4], [6, 0.05], [17, 0.2], [20, 1], [24, 1]]}
    efeitos:
      necessidades: {tedio: -40, social: -30, sono: 10, fome: 5}
      # cerveja deixa o briguento esquentado (é daí que sai a briga "por nada")
      por_traco:
        briguento: {raiva: 45}
        ranzinza: {raiva: 15}
      dano_estrutura: 4   # festa boa sempre quebra alguma coisa
    infracao: barulho
    narracao: "{eu} cai na festa em {lugar}."
    fala: festejar
    chance_fala: 0.5
    tags: [evento]

  # ------------------------------------------------------------ conflito
  - id: discutir
    nome: Discutir
    descricao: Bate-boca aos gritos. Casais e amigos discutem mais que estranhos.
    tipo: social
    peso: 1.0
    duracao_minutos: [4, 12]
    em_qualquer_lugar: true
    condicoes:
      alvo: {obrigatorio: true}
    consideracoes:
      - entrada: necessidade.raiva
        curva: {tipo: pontos, pontos: [[0, 0.08], [15, 0.12], [35, 0.35], [55, 0.75], [80, 1]]}
      - entrada: afinidade
        nota: briga-se com quem se odeia... e com quem se ama
        curva: {tipo: pontos, pontos: [[-100, 1], [-40, 0.6], [10, 0.12], [60, 0.3], [100, 0.7]]}
    efeitos:
      necessidades: {raiva: -35, tedio: -10}
      alvo_necessidades: {raiva: 15}
      afinidade: -3
      afinidade_do_alvo: -4
    cooldown_minutos: 90
    interrompe_alvo: true
    # quem levou a bronca fica uns minutos emburrado antes de decidir o que fazer
    reacao_alvo: emburrar
    memoria: discussao
    evento: argument
    narracao: "{eu} bate boca com {outro} em {lugar}."
    fala: discussao
    chance_fala: 0.95
    fala_alvo: resposta_discussao
    chance_fala_alvo: 0.8
    tags: [briga]
    importancia: 1

  - id: brigar
    nome: Brigar
    descricao: Briga de pastelão (tapa, torta, cadeira). Infração.
    tipo: social
    peso: 1.6
    duracao_minutos: [3, 12]
    em_qualquer_lugar: true
    condicoes:
      alvo: {obrigatorio: true}
    consideracoes:
      - entrada: necessidade.raiva
        curva: {tipo: logistica, meio: 60, inclinacao: 0.13}
      - entrada: afinidade
        curva: {tipo: pontos, pontos: [[-100, 1], [-30, 0.6], [30, 0.2], [70, 0.15], [100, 0.08]]}
      - entrada: necessidade.medo
        nota: quem está com medo não parte pra cima de ninguém
        curva: {tipo: pontos, pontos: [[0, 1], [30, 0.6], [60, 0.1]]}
    efeitos:
      necessidades: {raiva: -55, sono: 5}
      alvo_necessidades: {raiva: 15, medo: 30}
      afinidade: -10
      afinidade_do_alvo: -15
      dano_estrutura: 18
    falha:
      chance: 0.25
      efeitos:
        necessidades: {raiva: 15}
      fala: tombo
      memoria: tombo
    interrompe_alvo: true
    cooldown_minutos: 180
    chance_perseguicao: 0.3
    memoria: briga
    infracao: brigar
    evento: fight
    narracao: "{eu} parte pra cima de {outro} em {lugar}!"
    fala: briga
    chance_fala: 0.95
    fala_alvo: resposta_briga
    chance_fala_alvo: 0.7
    tags: [briga]
    importancia: 2

  - id: pedir_desculpas
    nome: Pedir desculpas
    descricao: Vai atrás de quem brigou com ele e pede desculpas (às vezes não colam).
    tipo: social
    peso: 1.2
    duracao_minutos: [3, 10]
    em_qualquer_lugar: true
    ir_atras: true
    condicoes:
      alvo: {obrigatorio: true}
    consideracoes:
      - entrada: conflito_alvo
        curva: {tipo: pontos, pontos: [[0, 0], [8, 0.2], [30, 0.8], [60, 1]]}
      - entrada: afinidade_inicial
        nota: quem se ama de verdade faz as pazes rápido (quem nunca se gostou, não)
        curva: {tipo: pontos, pontos: [[-100, 0], [-10, 0], [10, 0.1], [40, 0.4], [80, 1]]}
      - entrada: necessidade.raiva
        nota: ainda bufando, ninguém pede desculpas
        curva: {tipo: pontos, pontos: [[0, 1], [40, 0.7], [70, 0.15], [90, 0.02]]}
    efeitos:
      necessidades: {raiva: -10}
      alvo_necessidades: {raiva: -25}
      afinidade: 8
      afinidade_do_alvo: 10
    falha:
      chance: 0.25
      efeitos:
        necessidades: {raiva: 10}
      fala: desculpas_recusadas
    reconcilia: true
    memoria: pazes
    evento: reconcile
    narracao: "{eu} pede desculpas para {outro}."
    fala: desculpas
    chance_fala: 0.9
    fala_alvo: aceita_desculpas
    chance_fala_alvo: 0.7
    tags: [conversa]
    importancia: 1

  - id: abracar
